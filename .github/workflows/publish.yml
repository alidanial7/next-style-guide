name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version comes from root package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Smoke
        run: pnpm smoke

      - name: Sync version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 (got: ${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > VERSION
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            const path = "cli/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = version;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            console.log("Synced cli/package.json →", version);
          ' "$VERSION"

      - name: Publish
        working-directory: cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## npm
            ```bash
            npx create-next-style-guide@${{ steps.ver.outputs.version }}
            ```

            Package: [`create-next-style-guide@${{ steps.ver.outputs.version }}`](https://www.npmjs.com/package/create-next-style-guide)

      - name: Verify published tarball
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # registry can lag a few seconds after publish
          for i in 1 2 3 4 5; do
            if npm view "create-next-style-guide@${VERSION}" version; then
              break
            fi
            sleep 5
          done
          WORK="$(mktemp -d)"
          cd "$WORK"
          npx --yes "create-next-style-guide@${VERSION}" VerifyApp --yes --preset minimal --no-install
          test -f VerifyApp/package.json
          test -f VerifyApp/AGENTS.md
          echo "Verified create-next-style-guide@${VERSION} scaffold"
