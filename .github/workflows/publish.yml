name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version comes from root package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Smoke
        run: pnpm smoke

      - name: Sync version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 (got: ${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > VERSION
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            for (const path of ["cli/package.json", "package.json"]) {
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
              pkg.version = version;
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
              console.log("Synced", path, "→", version);
            }
          ' "$VERSION"

      - name: Publish
        working-directory: cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Right after publish — npm mirrors can lag a few minutes; keep stderr quiet.
      - name: Verify published tarball
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PKG="create-next-style-guide@${VERSION}"
          REG="https://registry.npmjs.org/"
          echo "Waiting for ${PKG} on the registry (npm can lag after publish)…"
          ok=0
          # ~5 min: 30 × 10s; suppress npm's noisy E404 dumps while polling
          for i in $(seq 1 30); do
            if ver="$(npm view "${PKG}" version --registry="$REG" 2>/dev/null)"; then
              echo "  visible: ${ver} (attempt ${i}/30)"
              ok=1
              break
            fi
            echo "  not visible yet (attempt ${i}/30), sleeping 10s…"
            sleep 10
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "::error::${PKG} never appeared on npm after publish"
            exit 1
          fi
          WORK="$(mktemp -d)"
          cd "$WORK"
          npx --yes --registry="$REG" "${PKG}" VerifyApp --yes --preset minimal --no-install
          test -f VerifyApp/package.json
          test -f VerifyApp/AGENTS.md
          echo "Verified ${PKG} scaffold"

      - name: Commit version sync to main
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          echo "$VERSION" > VERSION
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            for (const path of ["cli/package.json", "package.json"]) {
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
              pkg.version = version;
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            }
          ' "$VERSION"
          git add VERSION package.json cli/package.json
          if git diff --cached --quiet; then
            echo "VERSION already synced on main"
            exit 0
          fi
          git commit -m "chore: sync version to ${VERSION}"
          git push origin HEAD:main

      - name: GitHub Release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## npm
            ```bash
            npx create-next-style-guide@${{ steps.ver.outputs.version }}
            ```

            Package: [`create-next-style-guide@${{ steps.ver.outputs.version }}`](https://www.npmjs.com/package/create-next-style-guide)
